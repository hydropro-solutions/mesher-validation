<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <div class="brand-block">
        <a class="brand" href="{{ '/' | relative_url }}">HydroPro</a>
        <div class="brand-sub">Mesher Validation</div>
      </div>
      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/cases/dtc/' | relative_url }}">DTC</a>
        <a href="{{ '/cases/ahmed25/' | relative_url }}">Ahmed 25°</a>
      </nav>
    </div>
  </header>

  <main class="container page-content">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div>HydroPro · Marine hydrodynamics, complex CFD simulation, and engineering software.</div>
      <div class="footer-small">Validation pages generated with GitHub Pages.</div>
    </div>
  </footer>
</body>
</html>
